name: Nix / Continuous Build

on:
  #schedule:
  #  - cron: "10 3 * * *" # Every night at 3:10am
  workflow_dispatch:
  push:
    branches:
      - dogfood
    paths:
      - '**/*.rs'
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/nix-continuous.yml'
      - 'nix/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'yashimaH/wezterm_private_for_fix'
    env:
      # `secrets` is only available in a job-level `env`, not in any `if`.
      # Expose it as a plain env var so the steps below can gate on it.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' && vars.CACHIX_CACHE_NAME != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.1

      - name: Cache build artifacts
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Check flake inputs
        # note: waiting for a release with node24 upgrade
        # see: https://github.com/DeterminateSystems/flake-checker-action/pull/110
        uses: DeterminateSystems/flake-checker-action@main
        with:
          flake-lock-path: ./nix/flake.lock
          ignore-missing-flake-lock: false

      - name: Warn when Cachix is not configured
        if: ${{ env.HAS_CACHIX != 'true' }}
        run: |
          echo "::warning title=Cachix disabled::Set the CACHIX_CACHE_NAME repository variable and the CACHIX_AUTH_TOKEN repository secret to push build results to Cachix."

      - name: Setup Cachix
        if: ${{ env.HAS_CACHIX == 'true' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build default package
        run: |
          nix build ./nix --json > result.json

      - name: Push to Cachix
        if: ${{ env.HAS_CACHIX == 'true' }}
        run: |
          cat result.json \
          | jq -r '.[].outputs | to_entries[].value' \
          | cachix push "${{ vars.CACHIX_CACHE_NAME }}"
